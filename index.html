<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#080b16">
    <meta name="description" content="Atefullah Zafar Zoi — web developer and Computer Science student at Kandahar University.">
    <title>Atefullah Zafar Zoi | Full-Stack Developer Portfolio</title>
    <meta property="og:title" content="Atefullah Zafar Zoi | Developer Portfolio">
    <meta property="og:description" content="Explore web projects, development skills, and verifiable professional certificates.">
    <meta name="color-scheme" content="dark">

    <!-- Font Awesome, Google Fonts, React, Babel and Chart.js; layout styled with custom CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        :root {
            color-scheme: dark;
            --bg: #080b16;
            --bg-soft: #0d1223;
            --panel: rgba(17, 24, 45, .78);
            --panel-solid: #11182d;
            --panel-hover: #151f39;
            --line: rgba(164, 180, 211, .14);
            --text: #f1f5ff;
            --muted: #a4aec5;
            --muted-2: #7f8ba8;
            --violet: #9b8cff;
            --blue: #5edbff;
            --pink: #f58acb;
            --green: #6ee7b7;
            --radius: 24px;
            --shadow: 0 24px 70px rgba(0, 0, 0, .28);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; scroll-padding-top: 90px; }
        body {
            margin: 0;
            color: var(--text);
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            line-height: 1.65;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 12% 8%, rgba(93, 75, 210, .20), transparent 32%),
                radial-gradient(ellipse at 88% 28%, rgba(26, 174, 210, .12), transparent 30%),
                radial-gradient(ellipse at 52% 90%, rgba(135, 75, 200, .10), transparent 34%),
                #080b16;
        }
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: .15;
            background-image: linear-gradient(rgba(160, 177, 220, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(160, 177, 220, .08) 1px, transparent 1px);
            background-size: 54px 54px;
            mask-image: linear-gradient(to bottom, black, transparent 80%);
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; }
        img { display: block; max-width: 100%; }
        ::selection { color: #080b16; background: #8eeaff; }
        #root { min-height: 100vh; }
        .container { width: min(1160px, calc(100% - 44px)); margin-inline: auto; }
        .gradient-text {
            color: transparent;
            background: linear-gradient(110deg, #b7a9ff 8%, #74e3ff 52%, #f5a1d5 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 11, 22, .76);
            border-bottom: 1px solid rgba(164, 180, 211, .11);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }
        .nav-inner { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 22px; }
        .brand { display: inline-flex; align-items: center; gap: 12px; min-width: 0; font-weight: 800; letter-spacing: -.04em; font-family: 'Space Grotesk', sans-serif; }
        .brand-mark {
            display: grid; place-items: center; flex: 0 0 42px; width: 42px; height: 42px;
            border: 1px solid rgba(255,255,255,.2); border-radius: 14px;
            background: linear-gradient(140deg, rgba(139, 124, 255, .96), rgba(57, 197, 233, .9));
            color: #07101d; font-size: 13px; box-shadow: 0 8px 26px rgba(107, 102, 255, .25);
        }
        .brand-name { font-size: 17px; white-space: nowrap; }
        .nav-links { display: flex; align-items: center; gap: clamp(12px, 2vw, 25px); }
        .nav-links a { color: #aeb8ce; font-size: 13px; font-weight: 600; transition: color .2s ease; }
        .nav-links a:hover, .nav-links a:focus-visible { color: #8eeaff; }
        .menu-toggle {
            display: none; align-items: center; justify-content: center; width: 42px; height: 42px;
            border: 1px solid var(--line); border-radius: 13px; color: var(--text); background: rgba(255,255,255,.04); cursor: pointer;
        }
        .mobile-menu { display: none; padding: 8px 0 18px; border-top: 1px solid var(--line); }
        .mobile-menu a { display: block; padding: 10px 2px; color: #c0c9dc; font-size: 14px; font-weight: 600; }
        .mobile-menu a:hover { color: var(--blue); }

        .hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); align-items: center; gap: clamp(34px, 6vw, 76px); padding-block: clamp(64px, 8vw, 106px) 82px; }
        .hero-copy { position: relative; z-index: 2; }
        .eyebrow {
            display: inline-flex; align-items: center; gap: 10px; padding: 8px 13px;
            color: #c5d4f4; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
            background: rgba(144, 131, 255, .09); border: 1px solid rgba(157, 145, 255, .25); border-radius: 999px;
        }
        .eyebrow-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 14px rgba(110, 231, 183, .8); }
        .hero h1 { margin: 22px 0 15px; font-family: 'Space Grotesk', sans-serif; font-size: clamp(43px, 6vw, 76px); font-weight: 700; letter-spacing: -.065em; line-height: 1.04; }
        .hero-subtitle { margin: 0; color: #c5cee1; font-size: clamp(15px, 1.7vw, 19px); font-weight: 500; }
        .hero-description { max-width: 570px; margin: 20px 0 0; color: var(--muted); font-size: 15px; line-height: 1.9; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 20px;
            border: 1px solid transparent; border-radius: 14px; font-size: 13px; font-weight: 700; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn-primary { color: #08101c; background: linear-gradient(110deg, #b5a6ff, #7be5f7); box-shadow: 0 12px 32px rgba(99, 147, 255, .22); }
        .btn-primary:hover { box-shadow: 0 16px 36px rgba(99, 147, 255, .32); }
        .btn-secondary { color: #e8edfb; border-color: rgba(169, 184, 219, .22); background: rgba(255,255,255,.035); }
        .btn-secondary:hover { border-color: rgba(142, 234, 255, .5); background: rgba(142,234,255,.06); }
        .hero-visual { position: relative; display: grid; place-items: center; min-height: 390px; isolation: isolate; }
        .hero-visual::before { content: ""; position: absolute; width: 76%; aspect-ratio: 1; border-radius: 50%; background: rgba(99, 102, 241, .22); filter: blur(65px); z-index: -1; }
        .orbit-ring { position: absolute; width: min(100%, 390px); aspect-ratio: 1; border: 1px dashed rgba(144, 164, 215, .27); border-radius: 50%; transform: rotate(-18deg); animation: orbit 55s linear infinite; }
        .orbit-ring::before, .orbit-ring::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 22px rgba(94,219,255,.8); }
        .orbit-ring::before { top: 13%; left: 20%; }
        .orbit-ring::after { right: 12%; bottom: 23%; background: var(--pink); box-shadow: 0 0 22px rgba(245,138,203,.7); }
        .profile-frame {
            position: relative; width: clamp(240px, 28vw, 330px); aspect-ratio: 1; padding: 8px; border-radius: 50%;
            background: conic-gradient(from 30deg, #8c7dff, #68e4f6, #f38bc8, #8c7dff);
            box-shadow: 0 0 0 12px rgba(138, 125, 255, .045), 0 26px 90px rgba(78, 78, 190, .28);
        }
        .profile-inner { width: 100%; height: 100%; padding: 7px; border-radius: 50%; background: #0b1020; overflow: hidden; }
        .profile-inner img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,.15); }
        .floating-chip { position: absolute; display: flex; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid rgba(173, 190, 225, .19); border-radius: 14px; color: #dce7fb; background: rgba(15, 22, 42, .86); box-shadow: 0 12px 35px rgba(0,0,0,.22); backdrop-filter: blur(14px); font-size: 12px; font-weight: 700; }
        .floating-chip i { color: var(--blue); font-size: 16px; }
        .chip-react { top: 17%; right: -2%; }
        .chip-code { bottom: 15%; left: -2%; }
        @keyframes orbit { to { transform: rotate(342deg); } }

        .section { padding-block: 76px; }
        .section-muted { position: relative; background: linear-gradient(180deg, transparent, rgba(17, 25, 48, .32), transparent); }
        .section-header { margin-bottom: 34px; text-align: center; }
        .section-title { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(28px, 3.5vw, 40px); font-weight: 700; letter-spacing: -.045em; line-height: 1.2; }
        .title-rule { width: 58px; height: 4px; margin: 15px auto 0; border-radius: 20px; background: linear-gradient(90deg, var(--violet), var(--blue)); }
        .surface {
            min-width: 0; padding: clamp(20px, 2.5vw, 29px); border: 1px solid var(--line); border-radius: var(--radius);
            background: linear-gradient(145deg, rgba(21, 29, 53, .92), rgba(13, 19, 37, .86));
            box-shadow: var(--shadow); backdrop-filter: blur(16px); transition: border-color .25s ease, transform .25s ease;
        }
        .surface:hover { border-color: rgba(142, 177, 255, .27); }
        .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .about-copy { color: #c0c9dc; font-size: 15px; line-height: 1.95; }
        .about-copy strong { color: #f4f7ff; font-weight: 700; }
        .achievement {
            display: flex; align-items: flex-start; gap: 15px; margin-top: 22px; padding: 17px;
            border: 1px solid rgba(245, 190, 91, .18); border-radius: 17px; background: linear-gradient(120deg, rgba(245, 190, 91, .09), rgba(245, 138, 203, .035));
        }
        .achievement-icon { display: grid; place-items: center; flex: 0 0 42px; width: 42px; height: 42px; border-radius: 13px; color: #f7c86a; background: rgba(245, 190, 91, .12); font-size: 19px; }
        .achievement p { margin: 0; color: #d8deec; font-size: 13px; }
        .achievement .achievement-title { margin-bottom: 4px; color: #fff1cb; font-weight: 800; }
        .info-list { display: grid; gap: 17px; }
        .info-row { display: grid; grid-template-columns: 42px minmax(0,1fr); align-items: start; gap: 13px; }
        .info-icon { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid rgba(142, 234, 255, .16); border-radius: 13px; color: var(--blue); background: rgba(94, 219, 255, .07); font-size: 16px; }
        .info-row p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.85; overflow-wrap: anywhere; }
        .info-row strong { display: block; margin-bottom: 2px; color: #f0f4ff; font-size: 14px; }

        .education-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card-icon { display: grid; place-items: center; width: 49px; height: 49px; margin-bottom: 18px; border: 1px solid rgba(157, 145, 255, .22); border-radius: 16px; color: #b8aaff; background: rgba(139, 124, 255, .10); font-size: 21px; }
        .card-title { margin: 0; color: #f3f6ff; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -.025em; line-height: 1.35; }
        .card-copy { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.85; }
        .certificate { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding: 13px 15px; border: 1px solid rgba(245, 190, 91, .17); border-radius: 13px; color: #f6d48e; background: rgba(245, 190, 91, .065); font-size: 12px; font-weight: 700; }
        .chart-card-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .chart-card-heading .card-title { font-size: 17px; }
        .chart-tag { padding: 5px 9px; border: 1px solid rgba(142, 234, 255, .15); border-radius: 999px; color: #9ceafa; background: rgba(94, 219, 255, .06); font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
        .grades-chart-box { height: 280px; width: 100%; }
        canvas { display: block; max-width: 100%; }
        .chart-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; color: #9daac4; font-size: 11px; }
        .legend-item { display: inline-flex; align-items: center; gap: 7px; }
        .legend-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: linear-gradient(135deg, #a89aff, #65dff8); }
        .legend-swatch.line { width: 15px; height: 3px; border-radius: 5px; background: #65dff8; }

        .skills-grid { display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, .85fr) minmax(0, 1.35fr); align-items: stretch; gap: 18px; }
        .skill-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 17px; }
        .skill-tile { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 10px 9px; border: 1px solid rgba(164,180,211,.10); border-radius: 12px; background: rgba(255,255,255,.025); transition: background .2s ease, transform .2s ease, border-color .2s ease; }
        .skill-tile:hover { transform: translateY(-2px); border-color: rgba(142,234,255,.2); background: rgba(142,234,255,.045); }
        .skill-tile i { flex: 0 0 20px; width: 20px; text-align: center; font-size: 18px; }
        .skill-tile span { min-width: 0; color: #c9d2e6; font-size: 11px; font-weight: 600; overflow-wrap: anywhere; }
        .language-chart-box { height: 205px; margin-top: 5px; }
        .language-list { display: grid; gap: 9px; margin-top: 10px; }
        .language-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 11px; border: 1px solid rgba(164,180,211,.1); border-radius: 11px; color: #c9d2e6; background: rgba(255,255,255,.025); font-size: 11px; }
        .language-item-name { display: inline-flex; align-items: center; gap: 8px; }
        .language-dot { width: 8px; height: 8px; border-radius: 50%; }
        .language-percent { color: #e8edfb; font-weight: 800; font-variant-numeric: tabular-nums; }
        .skills-chart-box { height: 370px; width: 100%; margin-top: 7px; }
        .chart-note { margin: 10px 0 0; color: var(--muted-2); font-size: 10px; }

        .projects-subtitle { margin: 15px 0 0; color: var(--muted); font-size: 13px; }
        .project-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 17px; }
        .project-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 19px; background: linear-gradient(160deg, rgba(21,29,53,.96), rgba(12,18,35,.96)); box-shadow: 0 15px 40px rgba(0,0,0,.18); transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
        .project-card:hover { transform: translateY(-6px); border-color: rgba(142, 234, 255, .3); box-shadow: 0 22px 48px rgba(0,0,0,.27); }
        .project-image-wrap { position: relative; height: 165px; overflow: hidden; background: #171f39; }
        .project-image-wrap::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(8,11,22,.35)); pointer-events: none; }
        .project-image { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
        .project-card:hover .project-image { transform: scale(1.07); }
        .project-content { padding: 16px; }
        .project-title { display: flex; align-items: flex-start; gap: 9px; margin: 0; color: #f2f5ff; font-size: 14px; font-weight: 800; line-height: 1.45; }
        .project-title i { flex: 0 0 auto; margin-top: 3px; color: #a99aff; }
        .project-desc { min-height: 38px; margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
        .project-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 13px; }
        .project-tag { padding: 4px 8px; border: 1px solid rgba(164,180,211,.12); border-radius: 7px; color: #b8c5dd; background: rgba(255,255,255,.035); font-size: 10px; font-weight: 600; }

        .contact-section { padding-block: 66px 30px; }
        .contact-shell { position: relative; overflow: hidden; padding: clamp(28px, 5vw, 54px); border: 1px solid rgba(151, 144, 255, .2); border-radius: 28px; text-align: center; background: radial-gradient(ellipse at 15% 0%, rgba(126, 105, 255, .16), transparent 45%), radial-gradient(ellipse at 90% 100%, rgba(56, 199, 225, .11), transparent 42%), linear-gradient(135deg, #121a32, #0d1326); box-shadow: var(--shadow); }
        .contact-shell::before { content: ""; position: absolute; top: -110px; right: -90px; width: 240px; height: 240px; border: 1px solid rgba(142,234,255,.1); border-radius: 50%; box-shadow: 0 0 0 28px rgba(142,234,255,.025), 0 0 0 56px rgba(142,234,255,.018); pointer-events: none; }
        .contact-shell .section-title { position: relative; }
        .contact-copy { position: relative; margin: 13px 0 27px; color: var(--muted); font-size: 14px; }
        .social-links { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .social-link { display: inline-flex; align-items: center; gap: 9px; padding: 11px 14px; border: 1px solid rgba(164,180,211,.16); border-radius: 12px; color: #dbe4f7; background: rgba(255,255,255,.035); font-size: 12px; font-weight: 700; transition: transform .2s ease, background .2s ease, border-color .2s ease; }
        .social-link i { font-size: 16px; color: #a99aff; }
        .social-link:hover { transform: translateY(-3px); border-color: rgba(142,234,255,.3); background: rgba(142,234,255,.06); }
        .social-link.whatsapp i { color: #6ee7b7; }
        .footer { padding: 25px 0 5px; color: #75819d; text-align: center; font-size: 11px; }
        .footer-rule { width: 100%; height: 1px; margin-bottom: 20px; background: linear-gradient(90deg, transparent, rgba(164,180,211,.16), transparent); }

        @media (max-width: 1050px) {
            .nav-links { gap: 13px; }
            .nav-links a { font-size: 12px; }
            .skills-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .skills-chart-card { grid-column: 1 / -1; }
            .skills-chart-box { height: 350px; }
            .project-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
        }
        @media (max-width: 760px) {
            .container { width: min(100% - 32px, 600px); }
            .nav-inner { min-height: 68px; }
            .brand-mark { width: 38px; height: 38px; flex-basis: 38px; border-radius: 12px; }
            .brand-name { font-size: 15px; }
            .nav-links { display: none; }
            .menu-toggle { display: inline-flex; }
            .mobile-menu { display: block; }
            .hero { grid-template-columns: 1fr; gap: 26px; padding-block: 56px 58px; text-align: center; }
            .hero-copy { order: 1; }
            .hero-visual { order: 0; min-height: 290px; }
            .profile-frame { width: clamp(215px, 55vw, 280px); }
            .orbit-ring { width: min(88%, 320px); }
            .chip-react { right: 0; top: 12%; }
            .chip-code { left: 0; bottom: 8%; }
            .hero h1 { font-size: clamp(42px, 10vw, 62px); }
            .hero-description { margin-inline: auto; }
            .hero-actions { justify-content: center; }
            .section { padding-block: 58px; }
            .about-grid, .education-grid { grid-template-columns: 1fr; }
            .skills-grid { grid-template-columns: 1fr; }
            .skills-chart-card { grid-column: auto; }
            .skills-chart-box { height: 380px; }
            .project-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
            .project-image-wrap { height: 145px; }
            .project-content { padding: 13px; }
            .project-title { font-size: 13px; }
            .contact-section { padding-top: 48px; }
        }
        @media (max-width: 460px) {
            .container { width: calc(100% - 26px); }
            .brand-name { font-size: 13px; }
            .brand { gap: 8px; }
            .hero { padding-top: 40px; }
            .hero-visual { min-height: 260px; }
            .profile-frame { width: 210px; }
            .floating-chip { padding: 8px 10px; font-size: 10px; }
            .chip-react { right: -3px; }
            .chip-code { left: -3px; }
            .hero h1 { font-size: 40px; }
            .hero-subtitle { font-size: 14px; }
            .hero-description { font-size: 13px; }
            .btn { min-height: 44px; padding-inline: 15px; font-size: 12px; }
            .surface { padding: 18px; border-radius: 20px; }
            .section-title { font-size: 29px; }
            .skill-tiles { gap: 7px; }
            .skill-tile { padding: 9px 7px; gap: 7px; }
            .skill-tile span { font-size: 10px; }
            .skills-chart-box { height: 365px; }
            .project-grid { grid-template-columns: 1fr; }
            .project-image-wrap { height: 185px; }
            .project-desc { min-height: auto; }
            .social-links { display: grid; grid-template-columns: 1fr 1fr; }
            .social-link { justify-content: center; padding-inline: 8px; font-size: 11px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }

        /* Premium credentials showcase — independent of existing sections */
        .certificates-section {position:relative; overflow:hidden; background:radial-gradient(ellipse at 90% 0%,rgba(130,99,255,.13),transparent 48%),radial-gradient(ellipse at 0% 90%,rgba(62,205,230,.08),transparent 42%);}
        .certificates-intro {max-width:760px;margin-bottom:35px;}
        .cert-kicker {display:inline-flex;align-items:center;gap:10px;color:#c6b2ff;font-size:11px;font-weight:800;letter-spacing:.2em;margin-bottom:15px;}
        .cert-title {font-size:clamp(29px,4.3vw,52px);letter-spacing:-.045em;font-weight:850;line-height:1.12;margin-bottom:15px;}

<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const chartTextColor = '#a4aec5';
    const chartGridColor = 'rgba(164, 180, 211, 0.13)';

    // Draw clear percentage labels directly on bar charts without adding another library.
    const valueLabelsPlugin = {
        id: 'portfolioValueLabels',
        afterDatasetsDraw(chart) {
            const { ctx } = chart;
            ctx.save();
            chart.data.datasets.forEach((dataset, datasetIndex) => {
                const meta = chart.getDatasetMeta(datasetIndex);
                if (meta.type !== 'bar' || meta.hidden) return;
                meta.data.forEach((bar, index) => {
                    const value = dataset.data[index];
                    const point = bar.getProps(['x', 'y'], true);
                    ctx.fillStyle = '#e6edff';
                    ctx.font = '600 11px Inter, sans-serif';
                    ctx.textBaseline = 'middle';
                    if (chart.options.indexAxis === 'y') {
                        ctx.textAlign = 'left';
                        ctx.fillText(`${value}%`, point.x + 8, point.y);
                    } else {
                        ctx.textAlign = 'center';
                        ctx.fillText(`${value}%`, point.x, point.y - 12);
                    }
                });
            });
            ctx.restore();
        }
    };

    // ---------- Skills bar chart ----------
    const SkillsChart = () => {
        const chartRef = useRef(null);
        useEffect(() => {
            if (!chartRef.current) return;
            const ctx = chartRef.current.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 560, 0);
            gradient.addColorStop(0, '#8e7bff');
            gradient.addColorStop(.55, '#6c9bff');
            gradient.addColorStop(1, '#61e0f5');
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['HTML', 'CSS', 'JavaScript', 'React', 'Bootstrap', 'PHP', 'Laravel', 'Python', 'Java', 'SQL', 'SEO', 'Git'],
                    datasets: [{
                        label: 'Illustrative skill levels',
                        data: [92, 88, 86, 82, 84, 78, 77, 75, 70, 80, 78, 85],
                        backgroundColor: gradient,
                        borderRadius: 7,
                        borderSkipped: false,
                        barThickness: 13,
                        maxBarThickness: 15
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 850, easing: 'easeOutQuart' },
                    layout: { padding: { top: 3, right: 25, bottom: 2 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#171f38',
                            borderColor: 'rgba(142,234,255,.25)',
                            borderWidth: 1,
                            titleColor: '#f3f6ff',
                            bodyColor: '#c6d1e8',
                            padding: 12,
                            displayColors: false,
                            callbacks: { label: (context) => ` Illustrative level: ${context.parsed.x}%` }
                        }
                    },
                    scales: {
                        x: {
                            min: 0, max: 110,
                            grid: { color: chartGridColor, drawBorder: false },
                            border: { display: false },
                            ticks: { stepSize: 20, color: chartTextColor, font: { family: 'Inter', size: 10 }, callback: (value) => value <= 100 ? `${value}%` : '' }
                        },
                        y: {
                            grid: { display: false },
                            border: { display: false },
                            ticks: { color: '#c8d2e7', padding: 8, font: { family: 'Inter', size: 11, weight: '500' } }
                        }
                    }
                },
                plugins: [valueLabelsPlugin]
            });
            return () => chart.destroy();
        }, []);
        return <canvas ref={chartRef} aria-label="Illustrative development skills bar chart" role="img"></canvas>;
    };

    // ---------- Language doughnut chart ----------
    const LanguageChart = () => {
        const chartRef = useRef(null);
        useEffect(() => {
            if (!chartRef.current) return;
            const chart = new Chart(chartRef.current.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: ['Pashto', 'Persian', 'English'],
                    datasets: [{
                        data: [100, 95, 85],
                        backgroundColor: ['#8f7cff', '#61dff5', '#f58acb'],
                        hoverBackgroundColor: ['#a99bff', '#91ecff', '#ffacd9'],
                        borderWidth: 0,
                        borderRadius: 5,
                        spacing: 4,
                        hoverOffset: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '76%',
                    animation: { animateRotate: true, duration: 900 },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#171f38',
                            borderColor: 'rgba(142,234,255,.25)',
                            borderWidth: 1,
                            titleColor: '#f3f6ff',
                            bodyColor: '#c6d1e8',
                            padding: 11,
                            callbacks: { label: (context) => ` ${context.label}: ${context.raw}%` }
                        }
                    }
                }
            });
            return () => chart.destroy();
        }, []);
        return <canvas ref={chartRef} aria-label="Language proficiency doughnut chart" role="img"></canvas>;
    };

    // ---------- Academic grades chart ----------
    const GradesChart = () => {
        const chartRef = useRef(null);
        useEffect(() => {
            if (!chartRef.current) return;
            const ctx = chartRef.current.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(155, 140, 255, .95)');
            gradient.addColorStop(1, 'rgba(82, 194, 238, .35)');
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['10th', '11th', '12th'],
                    datasets: [
                        { type: 'bar', label: 'Grades', data: [96, 98, 99], backgroundColor: gradient, borderRadius: 9, borderSkipped: false, barPercentage: .43, categoryPercentage: .68, order: 2 },
                        { type: 'line', label: 'Trend', data: [96, 98, 99], borderColor: '#61dff5', backgroundColor: '#61dff5', borderWidth: 3, fill: false, tension: .35, pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: '#d8faff', pointBorderColor: '#61dff5', pointBorderWidth: 2, order: 1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 850, easing: 'easeOutQuart' },
                    layout: { padding: { top: 18, right: 8, left: 4 } },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#171f38',
                            borderColor: 'rgba(142,234,255,.25)',
                            borderWidth: 1,
                            titleColor: '#f3f6ff',
                            bodyColor: '#c6d1e8',
                            padding: 12,
                            callbacks: { label: (context) => ` ${context.dataset.label}: ${context.parsed.y}%` }
                        }
                    },
                    scales: {

                            min: 85, max: 100,
                            grid: { color: chartGridColor, drawBorder: false },

                            ticks: { stepSize: 5, color: chartTextColor, font: { family: 'Inter', size: 10 }, callback: (value) => `${value}%` }
                        },
                        x: {
                            grid: { display: false },
                            border: { display: false },
                            ticks: { color: '#c8d2e7', font: { family: 'Inter', size: 11, weight: '600' } }
                        }
                    }
                },
                plugins: [valueLabelsPlugin]
            });
            return () => chart.destroy();
        }, []);
        return <canvas ref={chartRef} aria-label="Academic performance bar and trend chart" role="img"></canvas>;
    };


    // ---------- Technology ecosystem: real counts of listed tools, not invented proficiency ----------
    const StackChart = () => {
        const chartRef = useRef(null);
        useEffect(() => {
            if (!chartRef.current) return;
            const chart = new Chart(chartRef.current.getContext('2d'), {
                type: 'doughnut',

                    }]

                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '73%',

        return <canvas ref={chartRef} role="img" aria-label="Technology categories chart: five frontend, four backend, one data and three workflow tools"></canvas>;
    };

    // ---------- Project cards ----------
    // Images are original local concept illustrations, not screenshots of deployed projects.
    // Update descriptions, tech tags and live/demo links to reflect actual implementations.
    const projects = [
        { title: "Supermarket Management", desc: "Inventory, billing and retail operations", img: "project-art/supermarket.svg", icon: "fas fa-store", category: "Web Apps", tags: ["React", "Node"] },
        { title: "Bank Management System", desc: "Account and transaction management", img: "project-art/bank.svg", icon: "fas fa-university", category: "Web Apps", tags: ["Python", "Django"] },
        { title: "Hospital Management", desc: "Patient records and appointment workflows", img: "project-art/hospital.svg", icon: "fas fa-hospital-user", category: "Web Apps", tags: ["Java", "Spring"] },
        { title: "Fruit Portfolio", desc: "Colorful responsive product showcase", img: "project-art/fruit.svg", icon: "fas fa-apple-alt", category: "Web Apps", tags: ["HTML", "CSS"] },
        { title: "Titanic Analysis", desc: "Data exploration and survival prediction", img: "project-art/titanic.svg", icon: "fas fa-chart-line", category: "Data", tags: ["Python", "Pandas"] },
        { title: "HTML/CSS/JS Games", desc: "Interactive Tic-Tac-Toe and Snake games", img: "project-art/games.svg", icon: "fas fa-gamepad", category: "Tools & Games", tags: ["JavaScript", "Canvas"] },

        { title: "Online HTML Exam", desc: "Quiz questions and progress tracking", img: "project-art/exam.svg", icon: "fas fa-file-alt", category: "Tools & Games", tags: ["JavaScript", "AJAX"] },
        { title: "Weather Dashboard", desc: "Responsive weather forecast dashboard", img: "project-art/weather.svg", icon: "fas fa-cloud-sun", category: "Web Apps", tags: ["HTML", "CSS", "JavaScript"] },
        { title: "Web Academy Platform", desc: "Courses, lessons and learning experience", img: "project-art/academy.svg", icon: "fas fa-graduation-cap", category: "Web Apps", tags: ["Laravel", "PHP", "Bootstrap"] }
    ];

    // To add verification links later, replace only the empty url: 'https://coursera.org/verify/4TVFGAPIAPUQ' values below.
    // All images are local files in the certificates/ directory.
    const certificates = [
